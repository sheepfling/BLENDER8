# triaxis_catalog_reprint: physical wear is page-specific; copier defects are machine-specific.
extends = "bad_xerox"
name = "triaxis_catalog_reprint"
generation_depth = 3
copier_id = "logic-catalog-t2"
dpi = 220

[placement]
rotation_deg = {min = -1.6, max = 1.6}
shear_deg = {min = -0.06, max = 0.06}
translate_x_mm = {min = -1.3, max = 1.5}
translate_y_mm = {min = -1.4, max = 1.6}

[vignette]
strength = {min = 0.09, max = 0.17}
edge = "right"
width_mm = {min = 4.0, max = 9.0}

[repro]
blur_mm = {min = 0.02, max = 0.037}
resample = {min = 0.968, max = 0.994}
threshold_mix = 0.075
toner_bloom = 0.075
grain_sigma = 0.3

[handling]
stage = "after_copy"
coffee = false
fold = false
staple = true
punch_holes = false
preserve_color_after_copy = true
dust_count = 16
opacity = 0.28
stamp = "LOGIC FILE"

[tears]
enabled = false
stage = "before_copy"
count = {min = 1, max = 1}
edges = ["right", "bottom"]
depth_mm = {min = 1.5, max = 3.5}
length_mm = {min = 5.0, max = 13.0}
clearance_mm = 1.0

[protection]
regions = [{x0 = 0.066, y0 = 0.047, x1 = 0.938, y1 = 0.965}]
max_delta = 0.1

[output]
encoding = "jpeg"
jpeg_quality = 96

[streaks]
horizontal = {min = 2, max = 4}
vertical = {min = 1, max = 3}
opacity = {min = 0.035, max = 0.095}
roller_pitch_mm = 34.0
roller_opacity = 0.027

[[page_overrides]]
pages = [1, 3]
[page_overrides.patch.tears]
enabled = true
