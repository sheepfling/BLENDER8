# halfalabs_returned_correspondence: physical wear is page-specific; copier defects are machine-specific.
extends = "bad_xerox"
name = "halfalabs_returned_correspondence"
generation_depth = 3
copier_id = "halfalabs-file-room"
dpi = 220

[placement]
rotation_deg = {min = -1.2, max = 1.2}
shear_deg = {min = -0.06, max = 0.06}
translate_x_mm = {min = -1.3, max = 1.5}
translate_y_mm = {min = -1.4, max = 1.6}

[vignette]
strength = {min = 0.07, max = 0.14}
edge = "left"
width_mm = {min = 4.0, max = 9.0}

[repro]
blur_mm = {min = 0.017, max = 0.028}
resample = {min = 0.968, max = 0.994}
threshold_mix = 0.045
toner_bloom = 0.045
grain_sigma = 0.22

[handling]
stage = "after_copy"
coffee = false
fold = false
staple = true
punch_holes = false
preserve_color_after_copy = true
dust_count = 16
opacity = 0.28
stamp = ""

[tears]
enabled = false
stage = "before_copy"
count = {min = 1, max = 1}
edges = ["right", "bottom"]
depth_mm = {min = 1.5, max = 3.5}
length_mm = {min = 5.0, max = 13.0}
clearance_mm = 1.0

[protection]
regions = [{x0 = 0.066, y0 = 0.047, x1 = 0.938, y1 = 0.965}]
max_delta = 0.09

[output]
encoding = "jpeg"
jpeg_quality = 96

[streaks]
horizontal = {min = 1, max = 2}
vertical = {min = 1, max = 2}
opacity = {min = 0.025, max = 0.065}
roller_opacity = 0.015

[[page_overrides]]
pages = [1]
[page_overrides.patch.placement]
rotation_deg = {min = -0.4, max = 0.4}

[[page_overrides]]
pages = [3]
[page_overrides.patch.handling]
coffee = true
opacity = 0.31
[page_overrides.patch.handling.coffee_profile]
radius_mm = {min = 18.0, max = 21.0}
center_x = {min = 0.99, max = 1.025}
center_y = {min = 0.68, max = 0.78}
broken_rim = 0.60
droplets = {min = 0, max = 2}

[[page_overrides]]
pages = [7]
[page_overrides.patch.handling]
coffee = true
opacity = 0.34
[page_overrides.patch.handling.coffee_profile]
radius_mm = {min = 24.0, max = 29.0}
center_x = {min = -0.06, max = -0.015}
center_y = {min = 0.40, max = 0.50}
broken_rim = 0.45
droplets = {min = 1, max = 3}

[[page_overrides]]
pages = [8]
[page_overrides.patch.tears]
enabled = true
