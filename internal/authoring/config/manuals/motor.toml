# vortek_workbench: physical wear is page-specific; copier defects are machine-specific.
extends = "bad_xerox"
name = "vortek_workbench"
generation_depth = 3
copier_id = "motor-shop-v4"
dpi = 220

[placement]
rotation_deg = {min = -1.3, max = 1.3}
shear_deg = {min = -0.06, max = 0.06}
translate_x_mm = {min = -1.3, max = 1.5}
translate_y_mm = {min = -1.4, max = 1.6}

[vignette]
strength = {min = 0.08, max = 0.17}
edge = "bottom"
width_mm = {min = 4.0, max = 9.0}

[repro]
blur_mm = {min = 0.018, max = 0.03}
resample = {min = 0.968, max = 0.994}
threshold_mix = 0.05
toner_bloom = 0.05
grain_sigma = 0.24

[handling]
stage = "after_copy"
coffee = false
fold = true
staple = false
punch_holes = false
preserve_color_after_copy = true
dust_count = 16
opacity = 0.34
stamp = "SERVICE COPY"

[tears]
enabled = false
stage = "before_copy"
count = {min = 1, max = 1}
edges = ["right", "bottom"]
depth_mm = {min = 1.5, max = 3.5}
length_mm = {min = 5.0, max = 13.0}
clearance_mm = 1.0

[protection]
regions = [{x0 = 0.066, y0 = 0.047, x1 = 0.938, y1 = 0.965}]
max_delta = 0.09

[output]
encoding = "jpeg"
jpeg_quality = 96

[streaks]
horizontal = {min = 1, max = 2}
vertical = {min = 1, max = 2}
opacity = {min = 0.025, max = 0.065}
roller_opacity = 0.015

[[page_overrides]]
pages = [1]
[page_overrides.patch.handling]
coffee = true
opacity = 0.40
[page_overrides.patch.handling.coffee_profile]
radius_mm = {min = 23.0, max = 28.0}
center_x = {min = -0.02, max = 0.015}
center_y = {min = 0.80, max = 0.91}
broken_rim = 0.35
droplets = {min = 2, max = 4}
[page_overrides.patch.tears]
enabled = true
edges = ["bottom"]

[[page_overrides]]
pages = [4]
[page_overrides.patch.tears]
enabled = true
stage = "after_copy"
edges = ["right"]
