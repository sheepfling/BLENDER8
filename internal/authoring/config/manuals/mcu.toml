# northstar_archive: physical wear is page-specific; copier defects are machine-specific.
extends = "bad_xerox"
name = "northstar_archive"
generation_depth = 3
copier_id = "records-copier-n3"
dpi = 220

[placement]
rotation_deg = {min = -1.05, max = 1.05}
shear_deg = {min = -0.06, max = 0.06}
translate_x_mm = {min = -1.3, max = 1.5}
translate_y_mm = {min = -1.4, max = 1.6}

[vignette]
strength = {min = 0.07, max = 0.13}
edge = "left"
width_mm = {min = 4.0, max = 9.0}

[repro]
blur_mm = {min = 0.022, max = 0.032}
resample = {min = 0.968, max = 0.994}
threshold_mix = 0.04
toner_bloom = 0.04
grain_sigma = 0.18

[handling]
stage = "after_copy"
coffee = false
fold = false
staple = true
punch_holes = true
preserve_color_after_copy = true
dust_count = 16
opacity = 0.24
stamp = "CONTROL FILE"

[tears]
enabled = false
stage = "before_copy"
count = {min = 1, max = 1}
edges = ["right", "bottom"]
depth_mm = {min = 1.5, max = 3.5}
length_mm = {min = 5.0, max = 13.0}
clearance_mm = 1.0

[protection]
regions = [{x0 = 0.066, y0 = 0.047, x1 = 0.938, y1 = 0.965}]
max_delta = 0.085

[output]
encoding = "jpeg"
jpeg_quality = 96

[streaks]
horizontal = {min = 1, max = 2}
vertical = {min = 1, max = 2}
opacity = {min = 0.025, max = 0.065}
roller_opacity = 0.015

[[page_overrides]]
pages = [1, 32]
[page_overrides.patch.tears]
enabled = true
[page_overrides.patch.handling]
punch_holes = false
