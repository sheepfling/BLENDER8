[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blender8-document-foundry"
version = "0.7.0"
description = "Canonical LaTeX to reproducible, fictional workshop-copy datasheets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.3.5", "Pillow==12.3.0", "pydantic==2.13.4",
  "typer==0.26.3", "pypdfium2==5.8.0", "pypdf==5.9.0", "reportlab==4.4.9"
]

[project.optional-dependencies]
dev = [
  "mdrepo==0.0.1",
  "pre-commit>=4.0",
  "pyright>=1.1.400",
  "pytest==9.0.2",
  "ruff>=0.11",
  "rumdl>=0.2.49,<0.3",
]

[project.scripts]
b8-docs = "b8docs.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["b8docs"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "scripts", "tests", "tools", "platform/tools", "platform/tests"]
extraPaths = ["src", "platform/tools"]
reportMissingTypeStubs = false

[tool.rumdl]
line-length = 100
extend-enable = ["MD029", "MD060"]
exclude = ["internal/authoring/source_inputs/**", "internal/history/**"]

[tool.rumdl.MD029]
style = "ordered"

[tool.rumdl.MD060]
style = "aligned"

[tool.rumdl.MD013]
line-length = 100

[tool.mdrepo]
include = ["*.md", "**/*.md"]
exclude = [
  ".git/**",
  ".local/**",
  ".venv*/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  "build/**",
  "dist/**",
  "generated/**",
  "reports/**",
  "internal/authoring/source_inputs/**",
  "internal/history/**",
]

[tool.mdrepo.links]
check-missing-targets = false
check-case = true

[tool.mdrepo.orphans]
enabled = true
roots = ["README.md"]
