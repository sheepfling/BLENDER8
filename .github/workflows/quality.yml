name: Python and Markdown quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/branch_policy.py --root .
      - run: python -m pip install -e ".[dev]"
      - run: python -m scripts.ci --static
